name: Build Android APK

# Zero local toolchain: GitHub runners provide Node, JDK and the Android SDK.
# Actions -> "Build Android APK" -> Run workflow -> download OiiQT-debug-apk.
on:
  workflow_dispatch:
    inputs:
      release:
        description: '同时创建一个 Release 并附上 APK'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure platform / build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: |
          npm run build
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Normalize APK name
        id: apk
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK" || { echo "No APK produced"; exit 1; }
          cp "$APK" "$RUNNER_TEMP/OiiQT.apk"
          echo "path=$RUNNER_TEMP/OiiQT.apk" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP/OiiQT.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OiiQT-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
            TAG="v$(date +%Y%m%d-%H%M%S)"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "OiiQT for Android $TAG" --generate-notes
          gh release upload "$TAG" "${{ steps.apk.outputs.path }}#OiiQT.apk" --clobber
          echo "Release: $(gh release view "$TAG" --json url -q .url)"
